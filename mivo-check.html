<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIVO Connection Check</title><style>body{font:16px system-ui;background:#160e20;color:#fff;padding:20px;line-height:1.9}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#2b1b39;padding:16px;border-radius:12px}button{padding:12px;border:0;border-radius:10px;background:#9a56e5;color:white}</style><h2>آزمایش اتصال MIVO</h2><p>این صفحه فقط اطلاعات عمومی قابل‌خواندن را بررسی می‌کند و هیچ داده‌ای تغییر نمی‌دهد.</p><button onclick="run()">بررسی مجدد</button><pre id="out">در حال بررسی…</pre><script>
const base='https://asdjxmztjlesrbwazczv.supabase.co/rest/v1/';
const key='sb_publishable_sT9ibl-gFG3Fcv98zDliRA_4n_lsYMx';
const out=document.getElementById('out');
async function check(table,params){try{let r=await fetch(base+table+'?'+params,{headers:{apikey:key,Authorization:'Bearer '+key,Accept:'application/json'}});let text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text.slice(0,200)};return {http:r.status,ok:r.ok,data};}catch(e){return{networkError:String(e)}}}
async function run(){out.textContent='در حال بررسی…';let a=await check('mivo_content','select=id,kind,status,starts_at&order=created_at.desc&limit=20');let b=await check('mivo_content','select=id,kind,status,starts_at&status=eq.published&order=created_at.desc&limit=20');let c=await check('mivo_settings','select=key&is_public=eq.true&limit=10');let report;try{let r=await fetch('/api/report-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:'manual_connection_test',page:'/mivo-check.html'})});report={http:r.status,response:(await r.text()).slice(0,200)}}catch(e){report={error:String(e)}}
const slim=x=>Array.isArray(x)?x.map(v=>({kind:v.kind,status:v.status,starts_at:v.starts_at,validDate:!Number.isNaN(Date.parse(v.starts_at))})):x;
out.textContent=JSON.stringify({content:{http:a.http,ok:a.ok,rows:slim(a.data)},published:{http:b.http,ok:b.ok,rows:slim(b.data)},settings:{http:c.http,ok:c.ok,keys:Array.isArray(c.data)?c.data.map(x=>x.key):c.data},report},null,2)}run();
</script></html>
