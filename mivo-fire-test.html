<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#04020c"><title>MIVO – Mystery Cube Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#04020c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% 40%,#211046 0%,#0a0618 45%,#04020c 78%)}.mivo-wrap{position:relative;width:min(90vw,430px);height:500px;isolation:isolate}.mivo-card{position:absolute;inset:3px;border-radius:25px;background:radial-gradient(ellipse at 50% 54%,#1b0d35 0%,#0b071b 55%,#080512 100%);overflow:hidden;display:flex;justify-content:center;align-items:center}.fire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.fire#fireBack{z-index:1}.fire#fireFront{z-index:3}.cube-wrap{z-index:2;position:relative;width:150px;height:150px;perspective:650px;transform:translateY(-20px);filter:drop-shadow(0 0 19px #7335ff88)}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:turn 14s linear infinite}.face{position:absolute;width:150px;height:150px;display:grid;place-items:center;border:2px solid #9b7dffcc;background:linear-gradient(135deg,#281255f5,#0d1236f5 55%,#321057f5);box-shadow:inset 0 0 26px #a449ff55,0 0 14px #7b5cff44;backface-visibility:visible}.face-front{transform:translateZ(75px)}.face-back{transform:rotateY(180deg) translateZ(75px)}.face-right{transform:rotateY(90deg) translateZ(75px)}.face-left{transform:rotateY(-90deg) translateZ(75px)}.face-top{transform:rotateX(90deg) translateZ(75px)}.face-bottom{transform:rotateX(-90deg) translateZ(75px)}.q{position:absolute;font-size:100px;line-height:1;font-weight:900;color:#f6ecff;text-shadow:0 0 9px #e1a5ff,0 0 22px #8654ff}.q-glow{filter:blur(12px);color:#b57cff;opacity:.7}.mivo-label{position:absolute;z-index:5;bottom:45px;font-size:14px;letter-spacing:.35em;font-weight:800;color:#e5d5ff;text-shadow:0 0 14px #af67ff}.mivo-border{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}@keyframes turn{0%{transform:rotateX(-16deg) rotateY(0)}50%{transform:rotateX(16deg) rotateY(180deg)}100%{transform:rotateX(-16deg) rotateY(360deg)}}@media(max-width:450px){.mivo-wrap{height:min(500px,75svh);min-height:360px}.cube-wrap{transform:translateY(-10px) scale(.85)}}@media(prefers-reduced-motion:reduce){.cube{animation-duration:40s}}
</style>
</head>
<body>
<div class="mivo-wrap" id="mivoWrap"><section class="mivo-card" id="mivoCard" aria-label="Coming soon: mystery NFT"><canvas class="fire" id="fireBack" aria-hidden="true"></canvas><div class="cube-wrap" id="cubeWrap"><div class="cube" id="cube"><div class="face face-front"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div><div class="face face-back"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div><div class="face face-right"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div><div class="face face-left"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div><div class="face face-top"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div><div class="face face-bottom"><span class="q q-glow" aria-hidden="true">?</span><span class="q">?</span></div></div></div><canvas class="fire" id="fireFront" aria-hidden="true"></canvas><div class="mivo-label">COMING SOON</div></section><canvas class="mivo-border" id="mivoBorder" aria-hidden="true"></canvas></div>
<script>
(()=>{'use strict';const back=document.getElementById('fireBack'),front=document.getElementById('fireFront'),border=document.getElementById('mivoBorder'),card=document.getElementById('mivoCard'),wrap=document.getElementById('mivoWrap');const layers=[{el:back,ctx:back.getContext('2d'),particles:[],count:115,front:false},{el:front,ctx:front.getContext('2d'),particles:[],count:35,front:true}];const bctx=border.getContext('2d');let w=0,h=0,bw=0,bh=0,last=0,raf=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){const r=card.getBoundingClientRect(),br=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;bw=br.width;bh=br.height;for(const l of layers){l.el.width=Math.round(w*d);l.el.height=Math.round(h*d);l.ctx.setTransform(d,0,0,d,0,0)}border.width=Math.round(bw*d);border.height=Math.round(bh*d);bctx.setTransform(d,0,0,d,0,0)}function spawn(l,p,randomAge=false){const side=Math.random()*2-1;const spread=l.front?72:115;p.x=w/2+side*spread;p.y=h*.64+Math.random()*65;p.age=randomAge?Math.random()*110:0;p.life=65+Math.random()*95;p.vx=(Math.random()-.5)*.7;p.vy=-(.85+Math.random()*1.25);p.width=(l.front?8:13)+Math.random()*(l.front?10:20);p.phase=Math.random()*6.283;p.freq=.018+Math.random()*.022;p.hue=[265,285,210,195,350,5][Math.floor(Math.random()*6)];p.alpha=l.front?.25:.45}function setup(){resize();for(const l of layers){l.particles=[];for(let i=0;i<l.count;i++){const p={};spawn(l,p,true);l.particles.push(p)}}}function flame(l,dt,t){const c=l.ctx;c.clearRect(0,0,w,h);c.globalCompositeOperation='lighter';for(const p of l.particles){p.age+=dt;if(p.age>p.life){spawn(l,p);continue}const f=p.age/p.life,yy=p.y+p.vy*p.age,drift=Math.sin(p.age*p.freq+p.phase+t*.0006)*18*f+Math.sin(t*.001+p.phase)*7*f;const xx=p.x+drift+p.vx*p.age;const width=p.width*(1-f*.85);const len=28+55*(1-f);const alpha=p.alpha*Math.sin(Math.PI*f)*.75;const grad=c.createLinearGradient(xx,yy,xx+drift*.4,yy-len);grad.addColorStop(0,`hsla(${p.hue},100%,58%,0)`);grad.addColorStop(.26,`hsla(${p.hue},100%,62%,${alpha*.7})`);grad.addColorStop(.66,`hsla(${p.hue+16},100%,75%,${alpha})`);grad.addColorStop(1,`hsla(${p.hue+30},100%,80%,0)`);c.beginPath();c.moveTo(xx-width,yy);c.bezierCurveTo(xx-width*1.4,yy-len*.3,xx+drift-width*.6,yy-len*.68,xx+drift*.8,yy-len);c.bezierCurveTo(xx+drift+width*.4,yy-len*.65,xx+width*1.3,yy-len*.25,xx+width,yy);c.closePath();c.fillStyle=grad;c.shadowColor=`hsla(${p.hue},100%,60%,.75)`;c.shadowBlur=l.front?12:22;c.fill();if(p.age%9<dt&&Math.random()<.25){c.beginPath();c.arc(xx,yy-len*.65,Math.random()*1.5+.3,0,Math.PI*2);c.fillStyle=`hsla(${p.hue},100%,85%,.7)`;c.fill()}}c.shadowBlur=0;c.globalCompositeOperation='source-over'}function roundedRect(c,x,y,width,height,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+width-r,y);c.quadraticCurveTo(x+width,y,x+width,y+r);c.lineTo(x+width,y+height-r);c.quadraticCurveTo(x+width,y+height,x+width-r,y+height);c.lineTo(x+r,y+height);c.quadraticCurveTo(x,y+height,x,y+height-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}function drawBorder(t){bctx.clearRect(0,0,bw,bh);const hue=(t*.018)%360;const g=bctx.createLinearGradient(0,0,bw,bh);for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${(hue+i*65)%360},100%,${i%2?72:58}%)`);bctx.lineWidth=2;bctx.strokeStyle=g;bctx.shadowColor=`hsl(${hue},100%,65%)`;bctx.shadowBlur=15;roundedRect(bctx,2,2,bw-4,bh-4,25);bctx.stroke();bctx.shadowBlur=0;const perimeter=2*(bw+bh-8),pos=(t*.13)%perimeter;const dots=30;for(let i=0;i<dots;i++){let q=(pos-i*5+perimeter)%perimeter,x,y;if(q<bw-4){x=2+q;y=2}else if(q<bw+bh-8){x=bw-2;y=2+q-(bw-4)}else if(q<2*bw+bh-12){x=bw-2-(q-(bw+bh-8));y=bh-2}else{x=2;y=bh-2-(q-(2*bw+bh-12))}bctx.beginPath();bctx.arc(x,y,1.8*(1-i/dots)+.2,0,Math.PI*2);bctx.fillStyle=`hsla(${(hue+60)%360},100%,80%,${.8*(1-i/dots)})`;bctx.shadowColor='#c4a2ff';bctx.shadowBlur=10;bctx.fill()}bctx.shadowBlur=0}function loop(t){if(!document.hidden){const dt=Math.min((t-last)/16.667||1,2);for(const l of layers)flame(l,reduced?dt*.3:dt,t);drawBorder(t)}last=t;raf=requestAnimationFrame(loop)}setup();const ro=new ResizeObserver(resize);ro.observe(card);ro.observe(wrap);raf=requestAnimationFrame(loop);window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);ro.disconnect()},{once:true})})();
</script>
</body></html>
