<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIVO – Mystery Cube Fire Test</title><style>
:root{--cube:132px;--pad:28px;--radius:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#04020c}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at center,#201046 0%,#04020c 70%);font-family:Arial,sans-serif}.mivo-wrap{position:relative;width:min(84vw,440px,67svh);aspect-ratio:4/5}.mivo-card{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;isolation:isolate;background:radial-gradient(70% 55% at 50% 58%,rgba(88,40,190,.38),transparent 70%),linear-gradient(#0b0720,#070416 55%,#0a0420)}.fire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}#fireBack{z-index:1}#fireFront{z-index:3}.mivo-border{position:absolute;left:calc(var(--pad)*-1);top:calc(var(--pad)*-1);width:calc(100% + var(--pad)*2);height:calc(100% + var(--pad)*2);pointer-events:none;z-index:6}.mivo-label{position:absolute;left:0;right:0;bottom:6.5%;z-index:4;text-align:center;font-weight:700;font-size:clamp(11px,3.4vw,15px);letter-spacing:.42em;color:#e0e7ff;text-shadow:0 0 12px #8a65ff}.cube-wrap{position:absolute;z-index:2;left:50%;top:57%;width:var(--cube);height:var(--cube);margin:calc(var(--cube)/-2) 0 0 calc(var(--cube)/-2);perspective:calc(var(--cube)*4.5)}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;will-change:transform}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;background:radial-gradient(90% 80% at 50% 100%,rgba(255,45,110,.3),transparent 65%),linear-gradient(150deg,#3a1c86,#1b1150 48%,#0b0833);box-shadow:inset 0 0 0 2px #96d7ff,inset 0 0 26px #8c5aff}.face:before{content:"";position:absolute;inset:9%;border:1px solid #8cdcff66;border-radius:6px}.face-front{transform:translateZ(calc(var(--cube)/2))}.face-back{transform:rotateY(180deg) translateZ(calc(var(--cube)/2))}.face-right{transform:rotateY(90deg) translateZ(calc(var(--cube)/2))}.face-left{transform:rotateY(-90deg) translateZ(calc(var(--cube)/2))}.face-top{transform:rotateX(90deg) translateZ(calc(var(--cube)/2))}.face-bottom{transform:rotateX(-90deg) translateZ(calc(var(--cube)/2))}.q{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cube)*.64);font-weight:900;color:#effcff;text-shadow:0 0 6px #78ebff,0 0 16px #4696ff,0 0 32px #9650ff}.q-glow{color:#be78ff;filter:blur(8px);animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.45;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.q-glow{animation:none}}
</style></head><body><div class="mivo-wrap" id="mivoWrap"><section class="mivo-card" id="mivoCard" aria-label="Coming soon: mystery NFT"><canvas class="fire" id="fireBack"></canvas><div class="cube-wrap" id="cubeWrap"><div class="cube" id="cube"><div class="face face-front"><span class="q q-glow">?</span><span class="q">?</span></div><div class="face face-back"><span class="q q-glow">?</span><span class="q">?</span></div><div class="face face-right"><span class="q q-glow">?</span><span class="q">?</span></div><div class="face face-left"><span class="q q-glow">?</span><span class="q">?</span></div><div class="face face-top"><span class="q q-glow">?</span><span class="q">?</span></div><div class="face face-bottom"><span class="q q-glow">?</span><span class="q">?</span></div></div></div><canvas class="fire" id="fireFront"></canvas><div class="mivo-label">COMING SOON</div></section><canvas class="mivo-border" id="mivoBorder"></canvas></div>
<script>
(()=>{'use strict';const card=document.getElementById('mivoCard'),cube=document.getElementById('cube'),cw=document.getElementById('cubeWrap'),back=document.getElementById('fireBack'),front=document.getElementById('fireFront'),border=document.getElementById('mivoBorder');const bc=back.getContext('2d'),fc=front.getContext('2d'),nc=border.getContext('2d');const rand=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;let W,H,S,dpr,t=0,last=0,active=true;let tongues=[],embers=[];const colors=[[75,110,255],[35,215,255],[156,65,255],[250,45,115],[255,100,160]];
function resize(){W=card.clientWidth;H=card.clientHeight;S=W*.30;card.style.setProperty('--cube',Math.round(S)+'px');dpr=Math.min(devicePixelRatio||1,1.5);for(const c of [back,front]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}border.width=Math.round((W+56)*dpr);border.height=Math.round((H+56)*dpr)}
function newFlame(initial=false){let side=rand(-1,1),layer=Math.random()<.84?0:1;return {x:W/2+side*S*rand(.38,.94),y:H*.57+rand(-.55,.57)*S,age:initial?rand(0,2.5):0,life:rand(1.7,3.4),height:S*rand(.7,2.1),width:S*rand(.10,.28),phase:rand(0,TAU),freq:rand(2.2,4.8),curl:rand(-.6,.6),color:Math.floor(rand(0,colors.length)),layer,drift:rand(-.4,.4)}}
function newEmber(initial=false){return {x:W/2+rand(-.95,.95)*S,y:H*.57+rand(-1.4,.7)*S,age:initial?rand(0,3):0,life:rand(1.2,3.6),vx:rand(-12,12),vy:rand(-65,-20),size:rand(1,3),color:Math.floor(rand(0,colors.length)),layer:Math.random()<.7?0:1}}
function ribbon(ctx,f,pass){let p=f.age/f.life,fade=Math.min(1,p*7,Math.max(0,(1-p)*4));if(fade<=0)return;let h=f.height*(.25+.75*Math.min(1,p*3))*(1-.48*p),width=f.width*[1,.62,.28][pass],baseX=f.x+f.drift*S*p*.4,baseY=f.y;let points=[];const N=18;for(let i=0;i<=N;i++){let u=i/N;let bend=(Math.sin(f.phase+u*f.freq-t*1.9)*.24+Math.sin(f.phase*1.7+u*7.2-t*2.6)*.12+f.curl*u*u)*S*u*u;let x=baseX+bend,y=baseY-h*u;let w=width*Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(u,.58))),.78)*(1+.13*Math.sin(t*4+u*12+f.phase));points.push({x,y,w})}ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<=N;i++){let a=points[i-1],b=points[i];ctx.quadraticCurveTo(a.x-a.w,a.y,(a.x+b.x)/2-(a.w+b.w)/2,(a.y+b.y)/2)}ctx.lineTo(points[N].x,points[N].y);for(let i=N-1;i>=0;i--){let a=points[i+1],b=points[i];ctx.quadraticCurveTo(a.x+a.w,a.y,(a.x+b.x)/2+(a.w+b.w)/2,(a.y+b.y)/2)}ctx.closePath();const rgb=colors[f.color],g=ctx.createLinearGradient(baseX,baseY,baseX,baseY-h);if(pass===0){g.addColorStop(0,`rgba(${rgb.join(',')},.85)`);g.addColorStop(.5,`rgba(${rgb.join(',')},.58)`);g.addColorStop(1,`rgba(${rgb.join(',')},0)`)}else if(pass===1){g.addColorStop(0,'rgba(120,200,255,.88)');g.addColorStop(.45,`rgba(${rgb.join(',')},.72)`);g.addColorStop(1,`rgba(${rgb.join(',')},0)`)}else{g.addColorStop(0,'rgba(245,250,255,.95)');g.addColorStop(.55,'rgba(180,215,255,.60)');g.addColorStop(1,'rgba(230,140,255,0)')}ctx.globalAlpha=fade*[.57,.53,.73][pass];ctx.fillStyle=g;ctx.fill()}
function drawFire(ctx,li){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='screen';for(let pass=0;pass<3;pass++)for(const f of tongues)if(f.layer===li)ribbon(ctx,f,pass);ctx.globalCompositeOperation='lighter';for(const e of embers){if(e.layer!==li)continue;let a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a*.9;let c=colors[e.color],g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.size*4);g.addColorStop(0,'#fff');g.addColorStop(.25,`rgba(${c.join(',')},.9)`);g.addColorStop(1,`rgba(${c.join(',')},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.size*4,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBorder(){nc.setTransform(dpr,0,0,dpr,0,0);nc.clearRect(0,0,W+56,H+56);const g=nc.createConicGradient(t*.55,28+W/2,28+H/2);const stops=['#a855ff','#3d7bff','#28d8ff','#a855ff','#ff2e63','#a855ff'];stops.forEach((v,i)=>g.addColorStop(i/(stops.length-1),v));roundRect(nc,28,28,W,H,26);nc.strokeStyle=g;nc.globalCompositeOperation='lighter';for(const [w,a] of [[25,.035],[15,.06],[9,.1],[5,.2],[2,1]]){nc.lineWidth=w;nc.globalAlpha=a;nc.stroke()}nc.globalAlpha=1;nc.globalCompositeOperation='source-over'}
function tick(now){requestAnimationFrame(tick);if(!active){last=now;return}let dt=Math.min(.05,(now-last)/1000||.016);if(now-last<12)return;last=now;t+=dt;cube.style.transform=`rotateX(${-0.4+.07*Math.sin(t*.53)}rad) rotateY(${t*.38}rad) rotateZ(${.05*Math.sin(t*.37)}rad)`;cw.style.transform=`translateY(${Math.sin(t*.9)*S*.025}px)`;for(const f of tongues)f.age+=dt;tongues=tongues.filter(f=>f.age<f.life);while(tongues.length<65)tongues.push(newFlame());for(const e of embers){e.age+=dt;e.x+=(e.vx+Math.sin(t*1.4+e.x)*9)*dt;e.y+=e.vy*dt}embers=embers.filter(e=>e.age<e.life);while(embers.length<85)embers.push(newEmber());drawFire(bc,0);drawFire(fc,1);drawBorder()}
resize();for(let i=0;i<65;i++)tongues.push(newFlame(true));for(let i=0;i<85;i++)embers.push(newEmber(true));new ResizeObserver(()=>{resize();tongues=[];embers=[]}).observe(card);if('IntersectionObserver'in window)new IntersectionObserver(e=>active=e[0].isIntersecting).observe(card);document.addEventListener('visibilitychange',()=>{active=!document.hidden;last=performance.now()});requestAnimationFrame(now=>{last=now;requestAnimationFrame(tick)})})();
</script></body></html>
